[package]
name = "scribex-engine"
version = "0.4.0-alpha"
description = "Tectonic typesetting for ScribeX, run in a crash-isolated worker process"
authors = ["Kunal Singh"]
edition = "2021"

[lib]
name = "scribex_engine"

[[bin]]
name = "scribex-typeset"
path = "src/bin/scribex-typeset.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned to git: the crates.io 0.15.0 release does not compile against the
# currently published sibling crates (tectonic_bundles 0.4.x changed the Bundle
# trait). Pinned to a commit so a push to master cannot change what we build.
tectonic = { git = "https://github.com/tectonic-typesetting/tectonic", rev = "c225dca2aa11a5fb84ce0d286f6e9de7da50e6b6" }
