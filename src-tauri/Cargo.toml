[package]
name = "scribex"
version = "0.1.0"
description = "Offline LaTeX reader and editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scribex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned to git: the crates.io 0.15.0 release does not compile against the
# currently published sibling crates (tectonic_bundles 0.4.x changed the Bundle
# trait). The git workspace is internally consistent. Revisit on the next release.
tectonic = { git = "https://github.com/tectonic-typesetting/tectonic", branch = "master" }
