[package]
name = "scribex"
version = "0.0.3-alpha"
description = "Offline LaTeX reader and editor"
authors = ["Kunal Singh"]
edition = "2021"

[lib]
# Distinct from the bin name; see https://github.com/rust-lang/cargo/issues/8519
name = "scribex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scribex-engine = { path = "../engine" }
