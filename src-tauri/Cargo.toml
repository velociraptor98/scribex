[package]
name = "scribex"
version = "0.1.0"
description = "Offline LaTeX reader and editor"
authors = ["Kunal Singh"]
edition = "2021"

[lib]
# Distinct from the bin name; see https://github.com/rust-lang/cargo/issues/8519
name = "scribex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned to git: the crates.io 0.15.0 release does not compile against the
# currently published sibling crates (tectonic_bundles 0.4.x changed the Bundle
# trait). Pinned to a commit so a push to master cannot change what we build.
tectonic = { git = "https://github.com/tectonic-typesetting/tectonic", rev = "c225dca2aa11a5fb84ce0d286f6e9de7da50e6b6" }
